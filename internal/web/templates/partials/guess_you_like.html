{{define "guess_you_like"}}
{{if .GuessYouLike.Enabled}}
<section class="guess-you-like" aria-labelledby="guess-you-like-title">
    <div class="guess-you-like-heading">
        <div>
            <h2 id="guess-you-like-title"><i class="fa-solid fa-headphones-simple"></i> 猜你喜欢</h2>
            {{if .GuessYouLike.Seeds}}
            <div class="guess-seeds" aria-label="本次推荐偏好">
                {{range .GuessYouLike.Seeds}}<span class="guess-seed">{{.}}</span>{{end}}
            </div>
            {{end}}
        </div>
        <button type="button" class="ctrl-btn primary guess-refresh" onclick="refreshGuessYouLike()">
            <i class="fa-solid fa-rotate"></i> 换一批
        </button>
    </div>
    {{if .GuessYouLike.Message}}
    <div class="guess-empty-state">
        <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
        <span>{{.GuessYouLike.Message}}</span>
    </div>
    {{end}}
</section>
{{end}}
{{end}}
